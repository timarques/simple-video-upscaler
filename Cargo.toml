[package]
name = "simple_video_upscaler"
version = "0.1.0"
edition = "2024"

[dependencies]
crossbeam-channel = "0.5.15"
indicatif = "0.17.8"
anyhow = "1.0.99"

[dependencies.image]
version = "0.25.2"
default-features = false
features = ["png"]

[dependencies.upscaler]
git = "ssh://git@github.com/timarques/upscaler.git"
rev = "4743e23"
default-features = false
features = ["realesrgan", "realcugan", "models", "image"]

[profile.release]
lto = true
opt-level = 3
strip = "debuginfo"
panic = "abort"
incremental = false
