name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  CMAKE_POLICY_VERSION_MINIMUM: "3.5"

jobs:
  rust:
    if: github.server_url == 'https://github.com'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Install native build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake ninja-build build-essential libvulkan-dev libomp-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - name: Configure git for private GitHub dependencies
        env:
          PRIVATE_DEPENDENCIES_TOKEN: ${{ secrets.PRIVATE_DEPENDENCIES_TOKEN }}
        run: |
          if [ -n "${PRIVATE_DEPENDENCIES_TOKEN:-}" ]; then
            git config --global --add url."https://x-access-token:${PRIVATE_DEPENDENCIES_TOKEN}@github.com/".insteadOf "ssh://git@github.com/"
            git config --global --add url."https://x-access-token:${PRIVATE_DEPENDENCIES_TOKEN}@github.com/".insteadOf "git@github.com:"
          fi
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
